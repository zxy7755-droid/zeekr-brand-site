openapi: 3.0.3
info:
  title: ZEEKR Brand Site API
  version: 0.1.0
  description: |
    P0 初始契约骨架。路径与 docs/delivery/design.md 中 RESOURCE_ROUTES 保持一致，
    改路径必须同时改契约、api 常量与前端调用方。
    COMPLIANCE: 本契约不包含任何官方文案原文，字段描述为工程占位。
servers:
  - url: http://localhost:3001
    description: 本地开发
  - url: https://api.example.com
    description: 生产占位（部署时覆盖）
tags:
  - name: health
  - name: vehicles
  - name: test-drive-leads
  - name: stores
  - name: news
paths:
  /health:
    get:
      tags: [health]
      summary: 健康检查
      operationId: getHealth
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /vehicles:
    get:
      tags: [vehicles]
      summary: 车型列表
      operationId: listVehicles
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页车型列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Vehicle' }
                  total: { type: integer }
  /vehicles/{slug}:
    get:
      tags: [vehicles]
      summary: 车型详情
      operationId: getVehicle
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 车型详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '404': { description: 车型不存在 }

  /test-drive-leads:
    post:
      tags: [test-drive-leads]
      summary: 提交预约试驾线索
      operationId: createTestDriveLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestDriveLeadInput' }
      responses:
        '201':
          description: 线索已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDriveLead' }
        '422': { description: 参数校验失败 }

  /stores:
    get:
      tags: [stores]
      summary: 门店列表
      operationId: listStores
      parameters:
        - name: city
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 门店列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Store' }

  /news:
    get:
      tags: [news]
      summary: 资讯列表
      operationId: listNews
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: 资讯列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/NewsArticle' }
                  total: { type: integer }

components:
  schemas:
    Health:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
        version: { type: string }
        timestamp: { type: string, format: date-time }
    Vehicle:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TestDriveLeadInput:
      type: object
      required: [vehicle, name, phone]
      properties:
        vehicle: { type: string }
        name: { type: string, maxLength: 64 }
        phone:
          type: string
          pattern: '^1[3-9]\\d{9}$'
        storeId: { type: string }
    TestDriveLead:
      allOf:
        - $ref: '#/components/schemas/TestDriveLeadInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    Store:
      type: object
      required: [id, name, city, address]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        address: { type: string }
    NewsArticle:
      type: object
      required: [id, slug, title]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        publishedAt: { type: string, format: date-time }
