openapi: 3.0.3
info:
  title: 企鹅汽车 PENGUIN MOTORS API (正式授权品牌官网)
  version: 1.0.0
  description: |
    P1 设计契约定稿（待签收）。本文件与 docs/delivery/design.md 的 RESOURCE_ROUTES、
    apps/api/src/contract.ts、前端 src/lib/contract.ts 保持一致；改路径必须四处同步。

    品牌口径：本工程为正式授权品牌官网，品牌使用授权由项目方声明并留存授权文件备查。
    所有车型、门店、资讯均为官网展示内容；图片字段引用 /brand/ 下的生成式原创素材；
    不包含任何第三方品牌的标识、车型图或文案原文。

    路径说明：paths 使用后端内部路径（无 /api 前缀）。对外经 Nginx 以 /api 前缀暴露，
    /api/vehicles 会转发为后端 /vehicles，servers 中的 URL 已包含该前缀。
servers:
  - url: http://localhost:3001
    description: 本地直连后端
  - url: https://stage.penguin.www.xueyuanzong.top/api
    description: staging（经 Nginx 反代）
  - url: https://penguin.www.xueyuanzong.top/api
    description: production（经 Nginx 反代）
tags:
  - name: health
    description: 健康检查
  - name: vehicles
    description: 车型（车型数据）
  - name: test-drive-leads
    description: 预约试驾线索（官网链路）
  - name: stores
    description: 门店（车型数据）
  - name: news
    description: 品牌资讯（品牌文案）

paths:
  /health:
    get:
      tags: [health]
      summary: 健康检查
      operationId: getHealth
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: 依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /vehicles:
    get:
      tags: [vehicles]
      summary: 车型列表（分页 + 筛选）
      operationId: listVehicles
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: series
          in: query
          description: 车系编码
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], default: PUBLISHED }
      responses:
        '200':
          description: 分页车型列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleList' }
        '400':
          description: 参数错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /vehicles/{slug}:
    get:
      tags: [vehicles]
      summary: 车型详情
      operationId: getVehicle
      parameters:
        - name: slug
          in: path
          required: true
          description: 车型 slug
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 车型详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleDetail' }
        '404':
          description: 车型不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /test-drive-leads:
    post:
      tags: [test-drive-leads]
      summary: 提交预约试驾线索（官网表单）
      operationId: createTestDriveLead
      description: |
        字段最小化：仅采集预约所需的最小必要信息。必须 consent=true 方可提交。
        成功响应只返回受理编号与时间，不回传手机号等个人信息。
        该接口需配置速率限制；日志中手机号须脱敏。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestDriveLeadInput' }
      responses:
        '201':
          description: 线索已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDriveLeadReceipt' }
        '422':
          description: 参数校验失败或未勾选同意
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 触发速率限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /stores:
    get:
      tags: [stores]
      summary: 门店列表
      operationId: listStores
      parameters:
        - name: city
          in: query
          description: 按城市过滤（参数）
          schema: { type: string }
      responses:
        '200':
          description: 门店列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreList' }

  /news:
    get:
      tags: [news]
      summary: 资讯列表（仅已发布）
      operationId: listNews
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: tag
          in: query
          schema: { type: string, enum: [BRAND, TECH, EVENT] }
      responses:
        '200':
          description: 分页资讯列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsList' }
        '400':
          description: 参数错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /news/{slug}:
    get:
      tags: [news]
      summary: 资讯详情
      operationId: getNewsArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 资讯详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsArticleDetail' }
        '404':
          description: 资讯不存在或未发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    PaginationMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    Health:
      type: object
      required: [status, service, version, timestamp, db]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, example: penguin-motors-api }
        version: { type: string, example: 1.0.0 }
        timestamp: { type: string, format: date-time }
        db: { type: string, enum: [ok, unavailable], description: MySQL 连通状态 }

    Vehicle:
      type: object
      required: [id, slug, name, series, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: demo-sedan-01 }
        name: { type: string, example: 车型 A }
        series: { type: string, example: DEMO-S }
        tagline: { type: string, example: 企鹅汽车纯电系列 }
        priceMin: { type: integer, description: 单位：元 }
        priceMax: { type: integer, description: 单位：元 }
        rangeKm: { type: integer, description: 续航参数（公里） }
        batteryKwh: { type: integer, description: 电池容量参数 }
        zeroToHundred: { type: number, format: float, description: 加速参数（秒） }
        seats: { type: integer, example: 5 }
        driveType: { type: string, example: AWD }
        imageKey: { type: string, description: 品牌图键，指向 /brand/ 目录, example: /brand/vehicle-a.jpg }
        badge: { type: string, example: 标签 }
        sortOrder: { type: integer, default: 0 }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    VehicleDetail:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties:
            highlights:
              type: array
              description: 参数组
              items: { $ref: '#/components/schemas/VehicleHighlight' }
            galleryKeys:
              type: array
              description: 品牌图键列表
              items: { type: string }

    VehicleHighlight:
      type: object
      required: [label, value]
      properties:
        label: { type: string, example: 续航 }
        value: { type: string, example: 600 km }

    VehicleList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    TestDriveLeadInput:
      type: object
      required: [vehicleSlug, name, phone, consent]
      properties:
        vehicleSlug: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 64 }
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          description: 仅用于格式校验，日志中须脱敏
        city: { type: string, maxLength: 32 }
        storeId: { type: string, maxLength: 64 }
        preferredAt: { type: string, format: date-time }
        consent:
          type: boolean
          description: 必须为 true；表示知悉「仅用于品牌官网，不会发起真实邀约」
          enum: [true]

    TestDriveLeadReceipt:
      type: object
      description: 不回传任何个人信息
      required: [id, createdAt, message]
      properties:
        id: { type: string, format: uuid, description: 受理编号 }
        createdAt: { type: string, format: date-time }
        message: { type: string, example: 已受理（品牌官网，不会发起真实邀约） }

    Store:
      type: object
      required: [id, name, city, address]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 体验中心 A }
        city: { type: string, example: 上海 }
        district: { type: string, example: 浦东新区 }
        address: { type: string, example: 地址 1 号 }
        phone: { type: string, example: '0000-0000000' }
        businessHours: { type: string, example: '10:00-18:00' }
        latitude: { type: number, format: double, description: 坐标 }
        longitude: { type: number, format: double, description: 坐标 }

    StoreList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Store' }
        total: { type: integer }

    NewsArticle:
      type: object
      required: [id, slug, title, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string, example: 企鹅汽车全新纯电系列正式发布 }
        summary: { type: string, example: 工程摘要，正式授权文案 }
        coverKey: { type: string, example: /brand/news-01.jpg }
        tag: { type: string, enum: [BRAND, TECH, EVENT] }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    NewsArticleDetail:
      allOf:
        - $ref: '#/components/schemas/NewsArticle'
        - type: object
          properties:
            body: { type: string, description: 正文（纯文本，不含官方文案） }

    NewsList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NewsArticle' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Error:
      type: object
      description: 统一错误响应（Problem+JSON 风格，不回显内部堆栈）
      required: [status, title, detail, traceId]
      properties:
        status: { type: integer, example: 404 }
        title: { type: string, example: Not Found }
        detail: { type: string, example: 资源不存在 }
        traceId: { type: string, description: 用于日志关联的追踪 ID }
