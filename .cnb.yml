# CNB 全量迁移流水线（与 .github/workflows 一一对应）
#   pull_request            -> ci.yml        三 job 门禁
#   main.push               -> cd.yml        构建镜像 + 部署 staging
#   tag_deploy.production   -> promote.yml   人工晋升生产
#   tag_deploy.contract-*   -> signoff.yml   契约签收审批
#   "crontab: */15 * * * *" -> monitor.yml   双域名探活
#
# 切换前置（详见 docs/delivery/cnb-migration.md）：
#   1. 凭据就绪前，在 CNB「设置 → 云原生构建」关闭自动触发
#   2. 密钥仓库注入 DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER
#   3. 开通 Docker 制品库，把 IMAGE_REGISTRY 改成制品库页面给出的实际地址
#   4. 部署机 docker login docker.cnb.cool，并下发 IMAGE_PREFIX
#   5. 全部就绪后把 CNB_DEPLOY_ENABLED 设为 true，再打开自动触发
#
# 密钥仓库引用（替换为真实路径后取消注释）：
# imports:
#   - https://cnb.cool/<ORG>/<SECRET_REPO>/-/blob/main/deploy.yml

env:
  NODE_VERSION: "20"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NEXT_TELEMETRY_DISABLED: "1"
  API_BASE_URL: http://localhost:3001
  IMAGE_REGISTRY: docker.cnb.cool/${CNB_REPO_SLUG_LOWERCASE}/-/docker

main:
  pull_request:
    - name: ci-contract-check
      runner: { cpus: 2 }
      docker: { image: node:20-bookworm-slim }
      stages:
        - name: contract files
          script: |
            set -eu
            for f in docs/api/openapi.yaml docs/delivery/design.md; do
              test -s "$f" || { echo "missing $f"; exit 1; }
            done
            head -1 docs/api/openapi.yaml | grep -Eq '^openapi: *3\.' || exit 1
            echo "contract ok"

    - name: ci-web
      runner: { cpus: 4 }
      docker: { image: node:20-bookworm-slim }
      stages:
        - name: install
          script: cd apps/web && npm ci --no-audit --no-fund
        - name: lint / typecheck / build
          script: |
            set -eu
            cd apps/web
            npm run lint
            npm run typecheck
            API_BASE_URL=http://localhost:3001 npm run build

    - name: ci-api
      runner: { cpus: 4 }
      docker: { image: node:20-bookworm-slim }
      # 单测依赖 MySQL；CNB services 语法需在首跑时按官方文档校验
      stages:
        - name: install + prisma generate
          script: cd apps/api && npm ci --no-audit --no-fund && npm run prisma:generate
        - name: lint / typecheck / test
          script: |
            set -eu
            cd apps/api
            npm run lint
            npm run typecheck
            npm run test
            npm run test:contract

  push:
    - name: build-and-push-images
      runner: { cpus: 4 }
      docker: { image: node:20-bookworm-slim }
      services: [docker]
      stages:
        - name: build web / api images
          script: |
            set -eu
            echo "$CNB_TOKEN" | docker login docker.cnb.cool --username cnb --password-stdin
            docker build -f apps/web/Dockerfile -t "$IMAGE_REGISTRY/web:$CNB_COMMIT" apps/web
            docker build -f apps/api/Dockerfile -t "$IMAGE_REGISTRY/api:$CNB_COMMIT" apps/api
            docker push "$IMAGE_REGISTRY/web:$CNB_COMMIT"
            docker push "$IMAGE_REGISTRY/api:$CNB_COMMIT"

    - name: deploy-staging
      runner: { cpus: 2 }
      docker: { image: node:20-bookworm-slim }
      stages:
        - name: ssh deploy staging
          script: |
            set -eu
            if [ "${CNB_DEPLOY_ENABLED:-}" != "true" ]; then
              echo "pre-cutover: skip staging deploy"
              exit 0
            fi
            install -m 700 -d "$HOME/.ssh"
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
            ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
            ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "bash /opt/zeekr/deploy.sh $CNB_COMMIT"
            rm -f "$HOME/.ssh/id_ed25519"

  "crontab: */15 * * * *":
    - name: monitor-production-and-staging
      runner: { cpus: 2 }
      docker: { image: node:20-bookworm-slim }
      stages:
        - name: probe both domains
          script: |
            set -eu
            for BASE in https://penguin.www.xueyuanzong.top https://stage.penguin.www.xueyuanzong.top; do
              for path in / /compare /api/health /api/vehicles; do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE$path" || true)
                echo "$BASE$path -> $code"
                [ "$code" = "200" ] || exit 1
              done
              health=$(curl -s --max-time 15 "$BASE/api/health")
              printf '%s' "$health" | grep -q '"db":"ok"' || exit 1
            done

$:
  tag_deploy.staging:
    - name: deploy-staging-slot
      runner: { cpus: 2 }
      docker: { image: node:20-bookworm-slim }
      stages:
        - name: promote staging slot
          script: |
            set -eu
            echo "staging deploy via /opt/zeekr/deploy.sh, tag=$tag_name"

  tag_deploy.production:
    - name: promote-production-slot
      runner: { cpus: 2 }
      docker: { image: node:20-bookworm-slim }
      stages:
        - name: promote prod slot
          script: |
            set -eu
            echo "production deploy via /opt/zeekr/deploy-prod.sh, tag=$tag_name"

  tag_deploy.contract-signoff:
    - name: contract-sign-off
      runner: { cpus: 2 }
      docker: { image: node:20-bookworm-slim }
      stages:
        - name: verify sign-off ledger
          script: |
            set -eu
            test -f docs/delivery/signoff.md
            grep -q "契约签收台账" docs/delivery/signoff.md
            echo "sign-off evidence recorded in this run's approvals"
