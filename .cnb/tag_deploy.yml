# CNB 部署环境：人工门禁统一收敛到 LoopForge 企微卡片（确认 / 返工 / 重试）。
# CNB 侧不再保留任何需要到平台页面点击的审批；production 在 staging 成功后自动晋升。
environments:
  - name: staging
    description: 预发环境（自动部署）
    env:
      name: staging

  - name: production
    description: 生产环境（staging 部署成功并静默 120s 后自动晋升）
    env:
      name: production
    permissions:
      users:
        - cnb.dEW8BphkAGA
    require:
      - environmentName: staging
        after: 120
