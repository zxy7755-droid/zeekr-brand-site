name: zeekr-prod

# Production slot. Same images as staging but isolated host ports (3002/3003)
# and a separate database (`zeekr_prod`). Promotion is a manual workflow.
services:
  api:
    image: ghcr.io/zxy7755-droid/zeekr-brand-site-api:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3001"
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      API_BASE_URL: https://penguin.www.xueyuanzong.top/api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ghcr.io/zxy7755-droid/zeekr-brand-site-web:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      PORT: 3000
      API_BASE_URL: https://penguin.www.xueyuanzong.top/api
    depends_on:
      api:
        condition: service_healthy
