name: 内容 / 素材变更
description: 占位素材、示意数据或文案调整（须先过合规检查）
title: "[CONTENT] "
labels: ["content", "compliance-review"]
body:
  - type: textarea
    id: change
    attributes:
      label: 变更内容
    validations:
      required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: 合规确认
      options:
        - label: 不含官方标识、官方车型图、官方文案原文
          required: true
        - label: 已标注为示意数据 / 占位素材
          required: true
        - label: 全站免责声明未被移除
          required: true
        - label: 如涉及个人信息，已确认最小化与留存策略
          required: false
