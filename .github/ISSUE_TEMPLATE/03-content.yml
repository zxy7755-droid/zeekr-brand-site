name: 内容 / 素材变更
description: 品牌视觉素材、车型数据或文案调整（须先过合规检查）
title: "[CONTENT] "
labels: ["content", "compliance-review"]
body:
  - type: textarea
    id: change
    attributes:
      label: 变更内容
    validations:
      required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: 合规确认
      options:
        - label: 不含官方标识、官方车型图、官方文案原文
          required: true
        - label: 已标注为车型数据 / 品牌视觉素材
          required: true
        - label: 全站版权信息未被移除
          required: true
        - label: 如涉及个人信息，已确认最小化与留存策略
          required: false
